name: CI/CD Mod 8
on:
  push:
    branches:
      - main
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci_cd_proj
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install django
      - name: Run tests
        run: |
            python manage.py test
      - name: Deploy
        run: |
            echo "Deploying application..."
